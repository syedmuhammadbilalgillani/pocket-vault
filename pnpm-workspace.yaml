# native-app is a separate Tauri + Vite app (offline-first desktop/Android
# client), not part of this Next.js app's build — listed here only so a
# single `pnpm install` at the repo root can manage both apps' lockfiles.
# It has its own independent package.json/dependency tree.
packages:
  - "."
  - "native-app"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Forces patched versions of transitive dependencies vendored by `next`
# (sharp's image-optimization pipeline, postcss's build tooling) — see
# `pnpm audit`. Both are build/server tooling only, not shipped to the
# client bundle, so overriding is low-risk.
overrides:
  sharp: ">=0.35.0"
  postcss: ">=8.5.23"

# native-app (the offline-first Tauri/Vite desktop+Android client) now
# lives in its own separate folder outside this repo, with its own
# package.json/lockfile/pnpm-workspace.yaml — it was moved out to avoid a
# Windows file-locking issue between OneDrive's sync of this repo's folder
# and Cargo's build output. Nothing to reference here anymore.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Forces patched versions of transitive dependencies vendored by `next`
# (sharp's image-optimization pipeline, postcss's build tooling) — see
# `pnpm audit`. Both are build/server tooling only, not shipped to the
# client bundle, so overriding is low-risk.
overrides:
  sharp: ">=0.35.0"
  postcss: ">=8.5.23"
